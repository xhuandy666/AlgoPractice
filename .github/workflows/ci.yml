name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macOS Apple Silicon
          - os: macos-15-intel
            target: macOS Intel
          - os: windows-2022
            target: Windows x64
    env:
      ALGOPRACTICE_RUNTIME_DIR: ${{ github.workspace }}/.runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and Electron
        run: npm ci
      - name: Diagnose native Windows process startup
        if: runner.os == 'Windows'
        run: node --import tsx scripts/windows-diagnostics.mjs
      - name: Install managed Python and Java
        run: npm run runtime:install
      - name: Check types
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Launch desktop and run both languages
        run: npm run test:desktop
