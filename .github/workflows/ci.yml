name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macOS Apple Silicon
            architecture: arm64
            bundle-directory: mac-arm64
          - os: macos-15-intel
            target: macOS Intel
            architecture: x64
            bundle-directory: mac
          - os: windows-2022
            target: Windows x64
    env:
      ALGOPRACTICE_RUNTIME_DIR: ${{ github.workspace }}/.runtime
      ALGOPRACTICE_NATIVE_TEST_ROOT: ${{ github.workspace }}/.runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and Electron
        run: npm ci
      - name: Verify Windows Job helper before managed environment installation
        if: runner.os == 'Windows'
        run: node --test tests/runner/windows-job.test.ts
      - name: Install and prewarm all four managed language environments
        run: npm run runtime:install
      - name: Check types
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Launch desktop and check baseline workflows
        run: npm run test:desktop
      - name: Check learning dashboard and review calendar
        run: npm run test:learning-center
      - name: Check problem review plans and first-Accepted self-rating with isolated fixtures
        run: npm run test:reviews
      - name: Check official judge and adaptive coach integration with isolated fixtures
        run: npm run test:official
      - name: Check application updates, verified downloads and draft persistence with isolated fixtures
        run: npm run test:updates
      - name: Check AI evidence references and repair through local protocol fixtures
        run: npm run test:ai
      - name: Check workbench notes and historical code comparison
        run: npm run test:workbench
      - name: Check compact navigation, pane resizing and source-bound adjacent problems
        run: npm run test:workbench-navigation
      - name: Check missing-runtime preparation and ACM editing
        run: npm run test:onboarding
      - name: Run Python, Java, Go and C++ in function and ACM formats
        run: npm run test:acm
      - name: Check Hot100 import and restart with isolated synthetic content
        run: npm run test:hot100
      - name: Package macOS installer and portable archive
        if: runner.os == 'macOS'
        # No credentials means ad-hoc signing and verified installer fallback. PRs never receive signing credentials.
        env:
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
        run: node scripts/package-desktop.mjs --platform darwin --arch ${{ matrix.architecture }}
      - name: Verify macOS application and archives
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "release/${{ matrix.bundle-directory }}/题炼.app"
          hdiutil verify "release/AlgoPractice-$(node -p 'require("./package.json").version')-mac-${{ matrix.architecture }}.dmg"
          unzip -tq "release/AlgoPractice-$(node -p 'require("./package.json").version')-mac-${{ matrix.architecture }}.zip"
      - name: Launch packaged macOS desktop
        if: runner.os == 'macOS'
        env:
          ALGOPRACTICE_PACKAGED_APP: ${{ github.workspace }}/release/${{ matrix.bundle-directory }}/题炼.app/Contents/MacOS/题炼
        run: npm run test:desktop
      - name: Check packaged macOS update discovery and installer handoff
        if: runner.os == 'macOS'
        env:
          ALGOPRACTICE_PACKAGED_APP: ${{ github.workspace }}/release/${{ matrix.bundle-directory }}/题炼.app/Contents/MacOS/题炼
        run: npm run test:updates
      - name: Upload verified macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos-${{ matrix.architecture }}-packages-${{ github.sha }}
          path: |
            release/AlgoPractice-*-mac-${{ matrix.architecture }}.dmg
            release/AlgoPractice-*-mac-${{ matrix.architecture }}.zip
            release/AlgoPractice-*-mac-${{ matrix.architecture }}.dmg.blockmap
            release/AlgoPractice-*-mac-${{ matrix.architecture }}.zip.blockmap
            release/latest-${{ matrix.architecture }}-mac.yml
            dist/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Package Windows installer and portable archive
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: node scripts/package-desktop.mjs --platform win32 --arch x64
      - name: Launch packaged Windows desktop
        if: runner.os == 'Windows'
        env:
          ALGOPRACTICE_PACKAGED_APP: ${{ github.workspace }}/release/win-unpacked/题炼.exe
        run: npm run test:desktop
      - name: Check packaged Windows update discovery and installer handoff
        if: runner.os == 'Windows'
        env:
          ALGOPRACTICE_PACKAGED_APP: ${{ github.workspace }}/release/win-unpacked/题炼.exe
        run: npm run test:updates
      - name: Upload verified Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-packages-${{ github.sha }}
          path: |
            release/AlgoPractice-*-win-x64.exe
            release/AlgoPractice-*-win-x64.zip
            release/AlgoPractice-*-win-x64.exe.blockmap
            release/latest.yml
            dist/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
