name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macOS Apple Silicon
          - os: macos-15-intel
            target: macOS Intel
          - os: windows-2022
            target: Windows x64
    env:
      ALGOPRACTICE_RUNTIME_DIR: ${{ github.workspace }}/.runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and Electron
        run: npm ci
      - name: Install managed Python and Java
        run: npm run runtime:install
      - name: Check types
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Launch desktop and run both languages
        run: npm run test:desktop
      - name: Check learning dashboard and review calendar
        run: npm run test:learning-center
      - name: Check official judge and adaptive coach integration with isolated fixtures
        run: npm run test:official
      - name: Check workbench notes and historical code comparison
        run: npm run test:workbench
      - name: Package Windows installer and portable archive
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: Launch packaged Windows desktop
        if: runner.os == 'Windows'
        env:
          ALGOPRACTICE_PACKAGED_APP: ${{ github.workspace }}/release/win-unpacked/题炼.exe
        run: npm run test:desktop
      - name: Upload verified Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-packages-${{ github.sha }}
          path: |
            release/AlgoPractice-*-win-x64.exe
            release/AlgoPractice-*-win-x64.zip
            dist/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
