name: Go and C++ toolchain preflight

on:
  push:
    branches: [codex/go-cpp-languages]
    paths:
      - .github/workflows/language-toolchain-preflight.yml
      - tests/toolchain-preflight.mjs
      - tests/fixtures/go-cpp-toolchains.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-toolchain-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macOS Apple Silicon
          - os: macos-15-intel
            target: macOS Intel
          - os: windows-2022
            target: Windows x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Verify pinned portable toolchains using isolated synthetic programs
        run: node tests/toolchain-preflight.mjs --root .local/go-cpp-preflight
      - name: Upload toolchain evidence without compiler archives or user data
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: language-toolchain-preflight-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: .local/go-cpp-preflight/preflight-results.json
          if-no-files-found: error
          retention-days: 7
